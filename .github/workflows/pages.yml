name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust local assets
        run: |
          cd app/public
          SHA=$(git rev-parse --short HEAD)
          sed -i 's|="styles\.css"|="styles.css?v='"$SHA"'"|' index.html
          sed -i 's|="invoice-parser\.js"|="invoice-parser.js?v='"$SHA"'"|' index.html
          sed -i 's|="drive\.js"|="drive.js?v='"$SHA"'"|' index.html
          sed -i 's|="localstore\.js"|="localstore.js?v='"$SHA"'"|' index.html
          sed -i 's|="app\.js"|="app.js?v='"$SHA"'"|' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/public
      - id: deployment
        uses: actions/deploy-pages@v4
